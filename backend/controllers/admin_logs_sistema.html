<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs do Sistema</title>
    <link rel="stylesheet" href="admin.css">
    <!-- Inclua aqui outros arquivos CSS do seu painel, se necessário -->
</head>
<body class="pagina-dashboard">
    <!-- Supondo uma estrutura similar a outras páginas do admin -->
    <div class="dashboard-main" style="padding: 40px;">
        <div class="header-flex">
            <div class="header-title-group">
                <h1>Logs do Sistema</h1>
                <p>Acompanhe os eventos e erros da plataforma com o status da tentativa subsequente.</p>
            </div>
        </div>
        <div class="filtros-container">
            <input type="text" id="log-search" class="campo-busca" placeholder="Buscar por email, mensagem...">
            <select id="log-filter" class="filtro-select">
                <option value="error">Apenas Erros</option>
                <option value="all">Todos os Logs</option>
                <option value="info">Apenas Informações</option>
                <option value="payment">Apenas Pagamentos</option>
            </select>
        </div>

        <div class="tabela-container">
            <div id="logs-loading"><p>Carregando logs...</p></div>
            <ul id="logs-list" class="logs-list-view"></ul>
            <div id="logs-empty" style="display: none; text-align: center; padding: 20px;"><p>Nenhum log encontrado.</p></div>
        </div>
    </div>
    <script src="admin_logs_sistema.js"></script>
</body>
</html>
