<div class="modern-dashboard-layout">
    <!-- Hero Moderno -->
    <div class="modern-hero-card">
        <div class="modern-hero-header">
            <div class="hero-content">
                <h1 class="modern-hero-title">Olá, <span id="nome-usuario-dash">Visitante</span>! 👋</h1>
                <p class="modern-hero-subtitle">Que bom te ver por aqui. Este é o seu espaço seguro para gerenciar sua jornada de cuidado.</p>
            </div>
        </div>
    </div>

    <!-- Grid de Informações (KPIs) -->
    <div class="kpi-grid" style="padding-top: 0; margin-bottom: 20px;">
        <div class="kpi-card" style="border-top-color: #1B4332;">
            <h4>Matches Compatíveis</h4>
            <p class="kpi-numero" id="kpi-matches">
                <span class="loading-spinner-sm"></span>
            </p>
            <span class="kpi-delta">Profissionais encontrados</span>
        </div>

        <div class="kpi-card" style="border-top-color: #F59E0B;">
            <h4>Favoritos Salvos</h4>
            <p class="kpi-numero" id="kpi-favoritos">
                <span class="loading-spinner-sm"></span>
            </p>
            <span class="kpi-delta">Perfis guardados</span>
        </div>

        <div class="kpi-card" style="border-top-color: #BE185D;">
            <h4>Minhas Avaliações</h4>
            <p class="kpi-numero" id="kpi-avaliacoes">
                <span class="loading-spinner-sm"></span>
            </p>
            <span class="kpi-delta">Feedbacks enviados</span>
        </div>
    </div>
</div>
