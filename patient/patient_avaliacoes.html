<div class="modern-dashboard-layout">
    <div class="main-header" style="padding: 20px 25px; margin-bottom: 25px;">
        <div>
            <h1 style="font-size: 1.8rem;">Minhas Avaliações</h1>
            <p class="subtitulo-header">Histórico das suas avaliações de profissionais.</p>
        </div>
    </div>

    <!-- Container Principal para as Avaliações -->
    <div id="reviews-list-container" class="profile-block" style="padding: 20px; border: none; background: transparent; box-shadow: none;">
        <!-- O conteúdo será inserido aqui pelo JavaScript -->
    </div>

    <!-- Estado Vazio (quando não há avaliações) -->
    <div id="reviews-empty-state" class="hidden smart-empty-state" style="background: transparent; border: none;">
        <span class="empty-state-icon" style="font-size: 3.5rem; color: #f39c12;">★</span>
        <h3 class="empty-state-text" style="color: var(--verde-escuro); font-weight: bold; font-size: 1.2rem; margin-bottom: 5px;">Nenhuma avaliação encontrada</h3>
        <p style="color: #666; margin-bottom: 25px;">Você ainda não avaliou nenhum profissional.</p>
    </div>
</div>
