<!DOCTYPE html>
<html lang="pt-BR">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>SOS Crise - Respiração Guiada | Yelo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/01-variables.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--verde-escuro, #1B4332);
            color: white;
            font-family: var(--font-principal, 'Inter', sans-serif);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header-sos {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-sos a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .sos-main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        /* Círculo Interativo */
        .breathing-circle-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .circle-base {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 50%;
        }
        .circle-animated {
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, var(--cor-Yelo, #FFEE8C) 0%, rgba(255, 238, 140, 0.4) 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255,238,140,0.2);
            transform: scale(1);
        }
        .instruction-text {
            position: absolute;
            z-index: 10;
            font-family: var(--font-titulos, 'Fraunces', serif);
            font-size: 1.8rem;
            color: var(--verde-escuro, #1B4332);
            text-align: center;
            font-weight: 600;
            width: 100%;
            text-shadow: 0 2px 10px rgba(255,255,255,0.5);
            transition: opacity 0.5s ease;
        }
        
        .controls {
            margin-top: 60px;
            text-align: center;
            z-index: 10;
        }
        .btn-start {
            background: white;
            color: var(--verde-escuro, #1B4332);
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .btn-start:hover { transform: scale(1.05); }
        
        .cta-bottom {
            padding: 30px;
            text-align: center;
            background: rgba(0,0,0,0.2);
        }
        .cta-bottom a {
            color: var(--cor-Yelo, #FFEE8C);
            font-weight: bold;
            text-decoration: none;
        }
    </style>

    <!-- Consent Manager Injected -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = window.gtag || gtag;
      function fbq(){
          if(window.fbq && window.fbq.callMethod) { window.fbq.apply(window, arguments); } 
          else { window._fbqQueue = window._fbqQueue || []; window._fbqQueue.push(arguments); }
      }
    </script>
    <script src="/js/consent-manager.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
          window.ConsentManager.injectGTAG(['AW-11236864912']);
          // Se for o questionario, injetamos tb o FB
          if(window.location.pathname.includes('psi_questionario')) {
              window.ConsentManager.injectMetaPixel(['2009156873008197']);
          }
      });
    </script>
    
</head>
<body>
    <header class="header-sos">
        <a href="ferramentas.html">&larr; Fechar</a>
        <img src="/assets/logos/logo-branca.png" alt="Logo Yelo" style="height: 26px; width: auto;">
    </header>

    <main class="sos-main">
        <div class="breathing-circle-wrapper">
            <div class="circle-base"></div>
            <div class="circle-animated" id="breathe-circle"></div>
            <div class="instruction-text" id="breathe-text">Acalme-se.</div>
        </div>
        
        <div class="controls">
            <button class="btn-start" id="btn-start">Começar a respirar</button>
        </div>
    </main>

    <footer class="cta-bottom">
        <p style="margin: 0; font-size: 0.95rem; color: rgba(255,255,255,0.8);">Quando estiver melhor, cuide da causa raiz. <a href="questionario.html">Fazer Match com Psicólogo</a></p>
    </footer>

    <script>
        const circle = document.getElementById('breathe-circle');
        const text = document.getElementById('breathe-text');
        const btn = document.getElementById('btn-start');
        let intervalId;

        function breatheCycle() {
            text.innerText = 'Inspire...';
            circle.style.transition = 'transform 4s ease-in-out';
            circle.style.transform = 'scale(2)'; // Expande
            
            setTimeout(() => {
                text.innerText = 'Segure...';
                setTimeout(() => {
                    text.innerText = 'Expire...';
                    circle.style.transition = 'transform 6s ease-in-out';
                    circle.style.transform = 'scale(1)'; // Contrai
                }, 4000); // Fica segurando 4s
            }, 4000); // Inspire demora 4s
        }

        btn.addEventListener('click', () => {
            btn.style.display = 'none';
            breatheCycle();
            intervalId = setInterval(breatheCycle, 14000); // Total do ciclo: 4 + 4 + 6 = 14s
        });
    </script>
</body>
</html>
