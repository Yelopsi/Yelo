<script>
(function() {
    const container = document.getElementById('avisos-feed-container');
    const template = document.getElementById('aviso-item-template');
    const token = localStorage.getItem('Yelo_token');
    let allAvisos = [];
    let currentFilter = 'all';
    let visibleCount = 10;

    function renderAvisos(avisos) {
        container.innerHTML = '';
        if (avisos.length === 0) {
            container.innerHTML = `<div class="smart-empty-state" style="margin: 0; padding: 40px 20px; background: #ffffff; border: 1.5px dashed #cbd5e1; border-radius: 16px; text-align: center;">
                <div class="empty-state-icon" style="font-size: 2.2rem; margin-bottom: 8px;">✨</div>
                <p class="empty-state-text" style="color: #475569; font-weight: 600; font-size: 0.95rem; margin: 0;">Nenhum aviso por aqui. Tudo em ordem!</p>
            </div>`;
            return;
        }

        avisos.forEach(aviso => {
            const clone = template.content.cloneNode(true);
            const item = clone.querySelector('.aviso-feed-item');
            const iconWrapper = item.querySelector('.aviso-icon-wrapper');
            const title = item.querySelector('.aviso-title');
            const meta = item.querySelector('.aviso-meta');
            const fullContent = item.querySelector('.aviso-full-content');
            const personalBadge = item.querySelector('.aviso-personal-badge');

            if (!aviso.read) {
                item.classList.add('unread');
            }

            const lowerTitle = aviso.title.toLowerCase();
            if (lowerTitle.includes('instabilidade') || lowerTitle.includes('manutenção') || lowerTitle.includes('importante')) {
                iconWrapper.innerHTML = '⚠️';
                iconWrapper.style.backgroundColor = '#fffbeb';
                iconWrapper.style.color = '#b45309';
                iconWrapper.style.borderColor = '#fcd34d';
            } else if (lowerTitle.includes('novidade') || lowerTitle.includes('lançamento') || lowerTitle.includes('compilado') || lowerTitle.includes('ajustes') || lowerTitle.includes('melhorias')) {
                iconWrapper.innerHTML = '🚀';
                iconWrapper.style.backgroundColor = '#ecfdf5';
                iconWrapper.style.color = '#047857';
                iconWrapper.style.borderColor = '#86efac';
            } else if (lowerTitle.includes('resposta') || lowerTitle.includes('comentário')) {
                iconWrapper.innerHTML = '💬';
                iconWrapper.style.backgroundColor = '#e0f2fe';
                iconWrapper.style.color = '#0284c7';
                iconWrapper.style.borderColor = '#bae6fd';
            } else {
                iconWrapper.innerHTML = '🔔';
                if (!aviso.read) {
                    iconWrapper.style.backgroundColor = '#16a34a';
                    iconWrapper.style.color = '#ffffff';
                    iconWrapper.style.borderColor = '#15803d';
                } else {
                    iconWrapper.style.backgroundColor = '#f1f5f9';
                    iconWrapper.style.color = '#1b4332';
                    iconWrapper.style.borderColor = '#cbd5e1';
                }
            }

            // Mostra a tag "Pessoal" se o aviso foi direcionado especificamente a este psicólogo
            if (aviso.psychologistId) {
                personalBadge.style.display = 'inline-block';
            }

            title.textContent = aviso.title;
            const date = new Date(aviso.createdAt).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
            if (!aviso.read) {
                meta.innerHTML = `Enviado por ${aviso.author || 'Equipe Yelo'} em ${date} <span class="aviso-click-hint">🔔 Clique para ler</span>`;
            } else {
                meta.innerHTML = `Enviado por ${aviso.author || 'Equipe Yelo'} em ${date}`;
            }
            
            // Replace [nome] with the user's name
            const userName = localStorage.getItem('Yelo_user_name') || 'Psi';
            const personalizedContent = aviso.content.replace(/\[nome\]/g, userName);
            fullContent.innerHTML = personalizedContent.replace(/\n/g, '<br>');

            item.addEventListener('click', (e) => {
                if (e.target.closest('.aviso-link-direto')) {
                    // O link já tem o seu próprio onclick
                    return;
                }

                if (!aviso.read) {
                    markAsRead(aviso.id, item);
                    aviso.read = true; // Update local state
                }
                
                const isExpanded = item.classList.contains('expanded');
                
                if (isExpanded) {
                    // NOVO: Verifica se tem link direto pro Fórum ou Blog para redirecionar na hora (segundo clique)
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = aviso.content;
                    const linkDireto = tempDiv.querySelector('.aviso-link-direto');
                    
                    if (linkDireto) {
                        if (linkDireto.dataset.page && typeof window.loadPage === 'function') {
                            window.loadPage(linkDireto.dataset.page);
                            return;
                        } else if (linkDireto.dataset.postId && typeof window.loadPage === 'function') {
                            let targetUrl = `psi_forum.html?postId=${linkDireto.dataset.postId}`;
                            if (linkDireto.dataset.commentId) {
                                targetUrl += `&commentId=${linkDireto.dataset.commentId}`;
                            }
                            window.loadPage(targetUrl);
                            return;
                        } else if (linkDireto.getAttribute('href') && linkDireto.getAttribute('href') !== '#') {
                            window.open(linkDireto.getAttribute('href'), '_blank');
                            return;
                        }
                    } else if (aviso.title.toLowerCase().includes('compilado') || aviso.title.toLowerCase().includes('novidade')) {
                        if (typeof window.loadPage === 'function') {
                            window.loadPage('psi_novidades.html');
                            return;
                        }
                    } else if (aviso.title.toLowerCase().includes('novo artigo no blog')) {
                        // Fallback para notificações antigas que não tinham o link injetado
                        window.open('/blog', '_blank');
                        return;
                    } else if (aviso.title.toLowerCase().includes('fórum') || aviso.title.toLowerCase().includes('tópico') || aviso.title.toLowerCase().includes('comentário') || aviso.title.toLowerCase().includes('resposta')) {
                        // Fallback para notificações antigas do fórum
                        if (typeof window.loadPage === 'function') {
                            window.loadPage('psi_forum.html');
                            return;
                        }
                    }
                }

                item.classList.toggle('expanded');
            });

            container.appendChild(item);
        });
        
        // NOVO: Botão "Ver mais"
        let loadMoreBtn = document.getElementById('btn-load-more-avisos');
        if (allAvisos.filter(a => (currentFilter === 'all') || (currentFilter === 'unread' && !a.read) || (currentFilter === 'personal' && a.psychologistId)).length > visibleCount) {
            if (!loadMoreBtn) {
                loadMoreBtn = document.createElement('button');
                loadMoreBtn.id = 'btn-load-more-avisos';
                loadMoreBtn.className = 'btn btn-secundario';
                loadMoreBtn.style.cssText = 'margin: 20px auto; display: block; padding: 10px 25px; border-radius: 50px; font-weight: bold; background: transparent; border: 2px solid var(--verde-escuro); color: var(--verde-escuro); cursor: pointer;';
                loadMoreBtn.textContent = 'Ver mais antigos';
                loadMoreBtn.onclick = () => {
                    visibleCount += 10;
                    filterAndRender();
                };
                container.parentNode.appendChild(loadMoreBtn);
            } else {
                loadMoreBtn.style.display = 'block';
            }
        } else {
            if (loadMoreBtn) loadMoreBtn.style.display = 'none';
        }
    }

    async function fetchAvisos() {
        try {
            const response = await fetch(`${API_BASE_URL}/api/psychologists/me/announcements?t=${new Date().getTime()}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            
            if (response.ok) {
                allAvisos = await response.json();
                filterAndRender();
            } else {
                const errText = await response.text();
                container.innerHTML = `<div style="padding: 20px; color: #d32f2f; text-align: center; background: #ffebee; border-radius: 12px; margin-top: 20px;">
                    <p><b>Erro ${response.status} ao carregar avisos.</b></p>
                    <p style="font-size: 0.85rem; color: #666;">Se o erro for 404, a rota '/me/announcements' não está mapeada no backend.</p>
                </div>`;
            }
        } catch (error) {
            container.innerHTML = '<p>Erro de conexão ao carregar avisos.</p>';
        }
    }

    async function markAsRead(avisoId, itemElement) {
        try {
            await fetch(`${API_BASE_URL}/api/psychologists/me/announcements/${avisoId}/read`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (itemElement) {
                itemElement.classList.remove('unread');
                const icon = itemElement.querySelector('.aviso-icon-wrapper');
                if (icon && icon.innerHTML.includes('🔔')) {
                    icon.style.backgroundColor = '#f1f5f9';
                    icon.style.color = '#1b4332';
                    icon.style.borderColor = '#cbd5e1';
                }
            }
            if (window.carregarAvisosBackground) window.carregarAvisosBackground(); // Atualiza a bolinha vermelha
        } catch (error) {
        }
    }
    
    async function markAllAsRead() {
        const unreadAvisos = allAvisos.filter(a => !a.read);
        if (unreadAvisos.length === 0) return;

        const btn = document.getElementById('btn-marcar-todos-lidos');
        btn.textContent = 'Marcando...';
        btn.disabled = true;

        try {
            const promises = unreadAvisos.map(aviso => 
                fetch(`${API_BASE_URL}/api/psychologists/me/announcements/${aviso.id}/read`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                })
            );
            await Promise.all(promises);
            
            allAvisos.forEach(a => a.read = true);
            document.querySelectorAll('.aviso-feed-item.unread').forEach(item => {
                item.classList.remove('unread');
                const icon = item.querySelector('.aviso-icon-wrapper');
                if (icon && icon.innerHTML.includes('🔔')) {
                    icon.style.backgroundColor = '#f1f5f9';
                    icon.style.color = '#1b4332';
                    icon.style.borderColor = '#cbd5e1';
                }
            });
            
            if (window.showToast) window.showToast('Todos os avisos foram marcados como lidos.', 'success');
            
            if (currentFilter === 'unread') filterAndRender();
            if (window.carregarAvisosBackground) window.carregarAvisosBackground(); // Remove a bolinha vermelha
        } catch (error) {
            if (window.showToast) window.showToast('Ocorreu um erro. Tente novamente.', 'error');
        } finally {
            btn.textContent = 'Marcar todos como lidos';
            btn.disabled = false;
        }
    }

    function filterAndRender() {
        let avisosToRender = allAvisos;
        if (currentFilter === 'unread') avisosToRender = allAvisos.filter(a => !a.read);
        if (currentFilter === 'personal') avisosToRender = allAvisos.filter(a => a.psychologistId);
        
        renderAvisos(avisosToRender.slice(0, visibleCount));
    }

    document.querySelectorAll('.aviso-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.aviso-filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
        visibleCount = 10; // Reseta a paginação ao trocar de aba
            filterAndRender();
        });
    });
