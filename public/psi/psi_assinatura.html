<script>
(async () => {
    const BASE_URL = (typeof window.API_BASE_URL !== 'undefined') ? window.API_BASE_URL : 'http://localhost:3001';
    const token = localStorage.getItem('Yelo_token');

    function resolveNewPricing(user) {
        if (typeof window.isYeloNewPricingActive === 'function') {
            return window.isYeloNewPricingActive(user);
        }
        if (user && typeof user.isNewPricingActive === 'boolean') {
            return user.isNewPricingActive;
        }
        return Date.now() >= Date.parse('2027-01-01T00:00:00-03:00');
    }

    const CYCLE_CONFIG = {
        MONTHLY: {
            label: 'Mensal',
            monthlyPrice: 159,
            oldPrice: null,
            noteHtml: 'Cobrança mensal de <strong>R$ 159</strong> · Sem fidelidade, cancele quando quiser',
            cta: 'Assinar Mensal - R$ 159/mês'
        },
        QUARTERLY: {
            label: 'Trimestral',
            monthlyPrice: 129,
            oldPrice: 'R$ 159',
            noteHtml: 'Trimestral: 3x de R$ 129 no cartão (total R$ 387) · <span class="plan-savings-inline">Economia de R$ 90</span>',
            cta: 'Assinar Trimestral - R$ 129/mês'
        },
        SEMIANNUAL: {
            label: 'Semestral',
            monthlyPrice: 99,
            oldPrice: 'R$ 159',
            noteHtml: 'Semestral: 6x de R$ 99 no cartão (total R$ 594) · <span class="plan-savings-inline">Economia de R$ 360</span>',
            cta: 'Assinar Semestral - R$ 99/mês'
        }
    };

    let mountedNewPricing = null;
    let selectedCycle = 'SEMIANNUAL';

    function updateCycleUI(cycleKey) {
        if (!mountedNewPricing) {
            selectedCycle = 'MONTHLY';
            const ctaBtn = document.getElementById('btn-assinar-essencial');
            if (ctaBtn) ctaBtn.setAttribute('data-cycle', 'MONTHLY');
            return;
        }
        const cfg = CYCLE_CONFIG[cycleKey] || CYCLE_CONFIG.SEMIANNUAL;
        selectedCycle = cycleKey;

        document.querySelectorAll('.sub-seg-btn').forEach(btn => {
            btn.classList.toggle('is-active', btn.getAttribute('data-cycle') === cycleKey);
        });

        const oldPriceEl = document.getElementById('essencial-old-price');
        const priceEl = document.getElementById('essencial-display-price');
        const noteEl = document.getElementById('essencial-billing-note');
        const ctaBtn = document.getElementById('btn-assinar-essencial');

        if (oldPriceEl) {
            if (cfg.oldPrice) {
                oldPriceEl.textContent = cfg.oldPrice;
                oldPriceEl.style.display = 'inline';
            } else {
                oldPriceEl.style.display = 'none';
            }
        }
        if (priceEl) priceEl.textContent = `R$ ${cfg.monthlyPrice}`;
        if (noteEl) noteEl.innerHTML = cfg.noteHtml;
        if (ctaBtn) {
            ctaBtn.setAttribute('data-cycle', cycleKey);
            if (!ctaBtn.disabled && (ctaBtn.textContent.trim().startsWith('Assinar') || ctaBtn.textContent.trim().startsWith('Testar'))) {
                ctaBtn.textContent = window.isEligibleForTrial7d
                    ? `Testar 7 dias grátis - ${cfg.label} (R$ ${cfg.monthlyPrice}/mês depois)`
                    : cfg.cta;
            }
        }
    }

    window.syncAssinaturaCycleUI = updateCycleUI;

    function bindCancellationModal(isNewPricing) {
        const modalCancelDesc = document.getElementById('modal-cancelamento-desc');
        if (modalCancelDesc) {
            modalCancelDesc.innerHTML = isNewPricing
                ? 'Você continuará com acesso aos benefícios até o fim do período pago. Após isso, sua conta mudará para o <strong>Plano Comunidade (Grátis)</strong> e seu perfil público será ocultado.'
                : 'Você continuará com acesso aos benefícios até o fim do período pago, mas sua assinatura não será renovada no próximo mês.';
        }

        const btnCancel = document.getElementById('btn-cancelar-assinatura');
        const modalCancel = document.getElementById('modal-cancelamento');
        const btnCloseModal = document.getElementById('btn-fechar-modal-cancel');
        const btnConfirmCancel = document.getElementById('btn-confirmar-cancelamento');

        document.querySelectorAll('body > #modal-cancelamento').forEach(el => el.remove());

        if (btnCancel && modalCancel) {
            btnCancel.onclick = () => {
                if (modalCancel.parentNode !== document.body) {
                    document.body.appendChild(modalCancel);
                }
                modalCancel.style.display = 'flex';
            };
        }
        if (btnCloseModal && modalCancel) {
            btnCloseModal.onclick = () => {
                modalCancel.style.display = 'none';
            };
        }
        if (btnConfirmCancel) {
            btnConfirmCancel.onclick = async () => {
                btnConfirmCancel.disabled = true;
                btnConfirmCancel.textContent = 'Processando...';

                try {
                    const res = await fetch(`${BASE_URL}/api/psychologists/me/cancel-subscription`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();

                    if (res.ok) {
                        modalCancel.style.display = 'none';
                        const modalSuccess = document.getElementById('modal-sucesso-cancelamento');
                        const msgEl = document.getElementById('msg-sucesso-cancelamento');
                        const btnClose = document.getElementById('btn-fechar-sucesso-cancel');

                        if (modalSuccess) {
                            if (msgEl) msgEl.textContent = data.message || 'Assinatura cancelada com sucesso.';
                            modalSuccess.style.display = 'flex';
                            if (btnClose) btnClose.onclick = () => window.location.reload();
                        } else {
                            alert(data.message || 'Assinatura cancelada com sucesso.');
                            window.location.reload();
                        }
                    } else {
                        alert(data.error || 'Houve um problema, mas vamos atualizar a página para verificar o status.');
                        window.location.reload();
                    }
                } catch (err) {
                    alert('Erro de conexão. A página será recarregada.');
                    window.location.reload();
                }
            };
        }
    }

    function mountStage(isNewPricing) {
        const stage = document.getElementById('assinatura-stage');
        const tplId = isNewPricing ? 'tpl-assinatura-jan27' : 'tpl-assinatura-prejan';
        const tpl = document.getElementById(tplId);
        if (!stage || !tpl) return;

        stage.innerHTML = '';
        stage.appendChild(tpl.content.cloneNode(true));
        mountedNewPricing = Boolean(isNewPricing);
        selectedCycle = isNewPricing ? 'SEMIANNUAL' : 'MONTHLY';

        if (isNewPricing) {
            document.querySelectorAll('.sub-seg-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cycle = btn.getAttribute('data-cycle');
                    if (cycle) updateCycleUI(cycle);
                });
            });
            updateCycleUI(selectedCycle);
        }

        document.querySelectorAll('.btn-upgrade').forEach(btn => {
            btn.onclick = (e) => {
                e.preventDefault();
                const cycle = mountedNewPricing ? (btn.getAttribute('data-cycle') || selectedCycle) : 'MONTHLY';
                if (window.iniciarPagamento) {
                    window.iniciarPagamento(btn.getAttribute('data-plano') || 'ESSENTIAL', btn, null, cycle);
                }
            };
        });

        bindCancellationModal(mountedNewPricing);

        if (window.inicializarAssinatura) {
            window.inicializarAssinatura();
        }
    }

    function bindReactivationButton(btnEssencial, cycleFallback) {
        btnEssencial.textContent = 'Reativar Assinatura ↺';
        btnEssencial.disabled = false;
        btnEssencial.style.background = '#F59E0B';
        btnEssencial.style.backgroundColor = '#F59E0B';
        btnEssencial.style.borderColor = '#F59E0B';
        btnEssencial.style.color = '#fff';
        btnEssencial.style.cursor = 'pointer';

        btnEssencial.onclick = async (e) => {
            e.preventDefault();
            const modalReativacao = document.getElementById('modal-reativacao');
            const btnConfirmar = document.getElementById('btn-confirmar-reativacao');
            const btnFechar = document.getElementById('btn-fechar-modal-reativacao');

            if (modalReativacao) {
                modalReativacao.style.display = 'flex';
                btnFechar.onclick = () => modalReativacao.style.display = 'none';

                const novoBtnConfirmar = btnConfirmar.cloneNode(true);
                btnConfirmar.parentNode.replaceChild(novoBtnConfirmar, btnConfirmar);

                novoBtnConfirmar.onclick = async () => {
                    novoBtnConfirmar.textContent = 'Processando...';
                    novoBtnConfirmar.disabled = true;

                    try {
                        const res = await fetch(`${BASE_URL}/api/psychologists/me/reactivate-subscription`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const d = await res.json();

                        if (res.ok) {
                            showToast('Assinatura reativada com sucesso! 🚀', 'success');
                            lancarConfetes();
                            setTimeout(() => window.location.reload(), 1500);
                        } else {
                            if (res.status === 400 || res.status === 404 || (d.error && (d.error.includes('encontrada') || d.error.includes('disponível')))) {
                                showToast('Assinatura anterior expirou. Por favor, realize uma nova assinatura.', 'info');
                                modalReativacao.style.display = 'none';
                                btnEssencial.textContent = cycleFallback;
                                btnEssencial.style.background = '#1B4332';
                                btnEssencial.style.backgroundColor = '#1B4332';
                                btnEssencial.disabled = false;
                                btnEssencial.onclick = (evt) => {
                                    evt.preventDefault();
                                    if (window.iniciarPagamento) {
                                        window.iniciarPagamento('ESSENTIAL', btnEssencial, null, mountedNewPricing ? selectedCycle : 'MONTHLY');
                                    }
                                };
                            } else {
                                showToast(d.error || 'Não foi possível reativar. Tente novamente.', 'error');
                                setTimeout(() => window.location.reload(), 2000);
                            }
                        }
                    } catch (err) {
                        showToast('Erro de conexão ao reativar.', 'error');
                        modalReativacao.style.display = 'none';
                    }
                };
            }
        };
    }

    function applyPreJanUserState(user) {
        const hoje = new Date();
        const hasSubscription = user.stripeSubscriptionId || user.subscriptionId;
        let planExpiresAt = user.planExpiresAt ? new Date(user.planExpiresAt) : null;

        if (!planExpiresAt && !hasSubscription && !user.is_exempt && user.plano !== 'Comunidade') {
            planExpiresAt = new Date(user.createdAt || hoje);
            planExpiresAt.setDate(planExpiresAt.getDate() + 7);
            if (planExpiresAt <= hoje) {
                planExpiresAt = new Date(hoje);
                planExpiresAt.setDate(planExpiresAt.getDate() + 7);
            }
        }

        const isInTrial = !hasSubscription && !user.is_exempt && user.plano !== 'Comunidade' && planExpiresAt && planExpiresAt > hoje;

        if (isInTrial) {
            const diffTime = planExpiresAt.getTime() - hoje.getTime();
            const diffDays = Math.min(7, Math.max(1, Math.ceil(diffTime / (1000 * 60 * 60 * 24))));
            const trialBannerGlobal = document.getElementById('trial-banner-global');
            const trialBannerDesc = document.getElementById('trial-banner-desc');
            const displayDate = new Date();
            displayDate.setDate(displayDate.getDate() + diffDays);

            if (trialBannerGlobal) trialBannerGlobal.style.setProperty('display', 'flex', 'important');
            if (trialBannerDesc) {
                trialBannerDesc.innerHTML = `Você ainda tem <strong>${diffDays} dias</strong> para conhecer e testar a plataforma. Não se preocupe, <strong>não exigimos cartão de crédito agora</strong>. Mas se você já amou e quiser garantir a sua assinatura agora mesmo, <strong>a primeira cobrança só acontecerá no dia ${displayDate.toLocaleDateString('pt-BR')}</strong>, quando o seu teste terminar. Fique tranquilo/a!`;
            }
        } else {
            const txtTrialMarketing = document.getElementById('txt-trial-marketing');
            if (txtTrialMarketing) txtTrialMarketing.style.display = 'none';
        }

        const isVip = user.is_exempt;
        if (isVip) {
            aplicarModoVip(user.plano, false);
            return;
        }

        if (user.plano) {
            const areaCancel = document.getElementById('area-cancelamento');
            if (areaCancel) {
                if (user.cancelAtPeriodEnd) {
                    areaCancel.style.display = 'none';
                    const statusBadge = document.querySelector('.status-badge');
                    if (statusBadge) {
                        statusBadge.innerHTML = '<span style="width: 8px; height: 8px; background: #F59E0B; border-radius: 50%;"></span> Cancelamento Agendado';
                        statusBadge.style.backgroundColor = '#FFFBEB';
                        statusBadge.style.color = '#B45309';
                        statusBadge.style.borderColor = '#FCD34D';
                    }
                } else if (hasSubscription) {
                    areaCancel.style.display = 'block';
                }
            }

            if (user.plano !== 'Comunidade') {
                const promoBadge = document.getElementById('tag-oferta-essencial');
                if (promoBadge) promoBadge.remove();
                const promoCard = document.getElementById('card-plano-essencial');
                if (promoCard) promoCard.classList.remove('promo-ativa');
            }

            if (user.plano === 'ESSENTIAL') {
                const btnEssencial = document.querySelector('#card-plano-essencial .btn-mudar-plano');
                if (btnEssencial) {
                    if (user.cancelAtPeriodEnd) {
                        bindReactivationButton(btnEssencial, 'Assinar Agora 🚀');
                    } else if (!hasSubscription || ['inactive', 'vencido', 'canceled'].includes(String(user.status || '').toLowerCase())) {
                        btnEssencial.textContent = hasSubscription ? 'Reativar Assinatura' : 'Assinar';
                        btnEssencial.disabled = false;
                        btnEssencial.onclick = (evt) => {
                            evt.preventDefault();
                            if (window.iniciarPagamento) {
                                window.iniciarPagamento('ESSENTIAL', btnEssencial, null, 'MONTHLY');
                            }
                        };
                    } else {
                        btnEssencial.textContent = 'Seu Plano Atual';
                        btnEssencial.disabled = true;
                        btnEssencial.style.backgroundColor = '#e0e0e0';
                        btnEssencial.style.borderColor = '#e0e0e0';
                        btnEssencial.style.color = '#888';
                        btnEssencial.style.cursor = 'default';
                    }
                }
            }
        }
    }

    function applyJan27UserState(user) {
        const hoje = new Date();
        const hasSubscription = user.stripeSubscriptionId || user.subscriptionId;
        const isTokenizedTrial = String(user.subscriptionId || '').startsWith('trial_tok_');
        const planExpiresAt = user.planExpiresAt ? new Date(user.planExpiresAt) : null;

        const isEligibleForTrial = !user.is_exempt && user.plano === 'Comunidade' && !hasSubscription && !user.firstPaidAt && !user.subscribedAt;
        window.isEligibleForTrial7d = isEligibleForTrial;

        const isInTrial = !user.is_exempt && user.plano !== 'Comunidade' && planExpiresAt && planExpiresAt > hoje && !user.firstPaidAt && (!hasSubscription || isTokenizedTrial);
        const trialBannerGlobal = document.getElementById('trial-banner-global');
        const trialBannerTitle = document.getElementById('trial-banner-title');
        const trialBannerDesc = document.getElementById('trial-banner-desc');
        const trialDemandProof = document.getElementById('trial-demand-proof');

        if (trialDemandProof && user.globalStats) {
            const m7 = Number(user.globalStats.matches7d || 0);
            const c7 = Number(user.globalStats.clicks7d || 0);
            if (m7 > 0 || c7 > 0) {
                trialDemandProof.textContent = `Demanda real na Yelo (últimos 7 dias): ${m7} ${m7 === 1 ? 'match gerado' : 'matches gerados'} e ${c7} ${c7 === 1 ? 'clique direto no WhatsApp' : 'cliques diretos no WhatsApp'}.`;
                trialDemandProof.style.display = 'block';
            } else {
                trialDemandProof.style.display = 'none';
            }
        }

        if (isInTrial) {
            const diffTime = planExpiresAt.getTime() - hoje.getTime();
            const diffDays = Math.min(7, Math.max(1, Math.ceil(diffTime / (1000 * 60 * 60 * 24))));
            if (trialBannerGlobal) trialBannerGlobal.style.display = 'flex';
            if (trialBannerTitle) trialBannerTitle.textContent = `Você está no seu teste grátis (${diffDays} ${diffDays === 1 ? 'dia restante' : 'dias restantes'})`;
            if (trialBannerDesc) {
                trialBannerDesc.innerHTML = `Aproveite a vitrine completa do Plano Essencial sem custos agora. O lançamento no cartão cadastrado só acontece em <strong>${planExpiresAt.toLocaleDateString('pt-BR')}</strong>.`;
            }
        } else if (isEligibleForTrial) {
            if (trialBannerGlobal) trialBannerGlobal.style.display = 'flex';
            if (trialBannerTitle) trialBannerTitle.textContent = 'Plano Comunidade: seu perfil não recebe cliques';
            if (trialBannerDesc) {
                const dataApos7Dias = new Date(hoje);
                dataApos7Dias.setDate(dataApos7Dias.getDate() + 7);
                trialBannerDesc.innerHTML = `No plano gratuito, seu perfil fica oculto nas buscas e não recebe contatos no WhatsApp. Escolha seu plano abaixo, cadastre seu cartão e teste o Plano Essencial completo por <strong>7 dias grátis</strong> antes da primeira cobrança (${dataApos7Dias.toLocaleDateString('pt-BR')}).`;
            }
            updateCycleUI(selectedCycle);
        }

        const isVip = user.is_exempt;
        const legacyBanner = document.getElementById('legacy-subscriber-banner');
        const isActivePaidSubscriber = !isVip && user.plano !== 'Comunidade' && user.status === 'active' && hasSubscription && !isInTrial;

        if (!isInTrial && (isVip || isActivePaidSubscriber)) {
            if (trialBannerGlobal) trialBannerGlobal.style.display = 'none';
        }

        if (legacyBanner) {
            legacyBanner.style.display = (isActivePaidSubscriber && user.isLegacySubscriber !== false) ? 'flex' : 'none';
        }

        if (isVip) {
            aplicarModoVip(user.plano, true);
            return;
        }

        if (user.plano) {
            const areaCancel = document.getElementById('area-cancelamento');
            if (areaCancel && user.plano !== 'Comunidade') {
                if (user.cancelAtPeriodEnd) {
                    areaCancel.style.display = 'none';
                    const statusBadge = document.querySelector('.status-badge');
                    if (statusBadge) {
                        statusBadge.innerHTML = '<span style="width: 7px; height: 7px; background: #F59E0B; border-radius: 50%;"></span> Cancelamento Agendado';
                        statusBadge.style.backgroundColor = '#FFFBEB';
                        statusBadge.style.color = '#B45309';
                        statusBadge.style.borderColor = '#FCD34D';
                    }
                } else if (hasSubscription) {
                    areaCancel.style.display = 'block';
                }
            }

            if (user.plano !== 'Comunidade') {
                const promoBadge = document.getElementById('tag-oferta-essencial');
                if (promoBadge) promoBadge.remove();
            }

            if (user.plano === 'ESSENTIAL' && user.status === 'active') {
                const cardEssencial = document.getElementById('card-plano-essencial');
                const cardComunidade = document.getElementById('card-plano-comunidade');
                if (cardEssencial) cardEssencial.classList.add('active-highlight');
                if (cardComunidade) cardComunidade.classList.remove('active-highlight');

                const btnEssencial = document.querySelector('#card-plano-essencial .btn-mudar-plano');
                if (btnEssencial) {
                    if (user.cancelAtPeriodEnd) {
                        bindReactivationButton(btnEssencial, CYCLE_CONFIG[selectedCycle].cta);
                    } else if (!hasSubscription || ['inactive', 'vencido', 'canceled'].includes(String(user.status || '').toLowerCase())) {
                        btnEssencial.textContent = hasSubscription ? 'Reativar Assinatura' : CYCLE_CONFIG[selectedCycle].cta;
                        btnEssencial.disabled = false;
                        btnEssencial.onclick = (evt) => {
                            evt.preventDefault();
                            if (window.iniciarPagamento) window.iniciarPagamento('ESSENTIAL', btnEssencial, null, selectedCycle);
                        };
                    } else if (hasSubscription) {
                        btnEssencial.textContent = isInTrial ? 'Teste Grátis Ativo (7 dias)' : 'Seu Plano Atual';
                        btnEssencial.disabled = true;
                        btnEssencial.style.background = '#e2e8f0';
                        btnEssencial.style.color = '#64748b';
                        btnEssencial.style.boxShadow = 'none';
                        btnEssencial.style.cursor = 'default';
                    }
                }
            } else if (user.plano === 'ESSENTIAL' && user.status === 'inactive') {
                const btnEssencial = document.querySelector('#card-plano-essencial .btn-mudar-plano');
                if (btnEssencial) btnEssencial.textContent = 'Reativar Assinatura';
            } else if (user.plano === 'Comunidade') {
                const cardEssencial = document.getElementById('card-plano-essencial');
                const cardComunidade = document.getElementById('card-plano-comunidade');
                if (cardEssencial) cardEssencial.classList.remove('active-highlight');
                if (cardComunidade) cardComunidade.classList.add('active-highlight');

                const btnComunidade = document.querySelector('#card-plano-comunidade .btn-plano-atual');
                if (btnComunidade) btnComunidade.textContent = 'Seu Plano Atual';

                const elPreco = document.getElementById('banner-preco');
                const elData = document.getElementById('banner-renovacao');
                if (elPreco) {
                    const wrapperPreco = elPreco.closest('div[style*="text-align: right"]') || elPreco.parentElement;
                    if (wrapperPreco) wrapperPreco.style.display = 'none';
                }
                if (elData) elData.style.display = 'none';
            }
        }
    }

    function aplicarModoVip(planName, isNewPricing) {
        const nomesPlanos = {
            'ESSENTIAL': 'Essencial',
            'CLINICAL': 'Clínico',
            'REFERENCE': 'Referência'
        };
        const nomeExibicao = nomesPlanos[planName] || planName || 'Essencial';

        const planNameEl = document.getElementById('vip-plan-name');
        if (planNameEl) planNameEl.textContent = `Plano ${nomeExibicao}`;

        if (isNewPricing) {
            const planosGrid = document.querySelector('.plans-bento-grid');
            if (planosGrid) planosGrid.style.setProperty('display', 'none', 'important');
            const cycleBar = document.getElementById('sub-cycle-bar');
            if (cycleBar) cycleBar.style.setProperty('display', 'none', 'important');
            const comingStrip = document.getElementById('card-plano-referencia');
            if (comingStrip) comingStrip.style.setProperty('display', 'none', 'important');
        } else {
            const planosGrid = document.querySelector('.plans-grid-modern');
            if (planosGrid) planosGrid.style.setProperty('display', 'none', 'important');
        }

        const areaCancel = document.getElementById('area-cancelamento');
        if (areaCancel) areaCancel.style.setProperty('display', 'none', 'important');

        const resumo = document.getElementById('card-resumo-assinatura');
        if (resumo) {
            resumo.style.display = 'flex';
            const nomePlano = document.getElementById('banner-nome-plano');
            if (nomePlano) nomePlano.textContent = `Plano ${nomeExibicao}`;

            const preco = document.getElementById('banner-preco');
            if (preco) preco.textContent = 'R$ 0,00 (Isento)';

            const renovacao = document.getElementById('banner-renovacao');
            if (renovacao) renovacao.textContent = 'Status: Isento';

            const badge = resumo.querySelector('.status-badge');
            if (badge) {
                badge.innerHTML = '💎 VIP Ativo';
                badge.style.backgroundColor = '#e6fffa';
                badge.style.color = '#1B4332';
                badge.style.borderColor = '#1B4332';
            }
        }

        const vipBanner = document.getElementById('vip-banner');
        if (vipBanner) vipBanner.style.display = 'block';

        const headerTitle = document.querySelector('.main-header h1');
        const headerDesc = document.querySelector('.main-header p');
        if (headerTitle) headerTitle.textContent = 'Sua Assinatura VIP';
        if (headerDesc) headerDesc.textContent = 'Você possui acesso especial concedido pela Yelo.';
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        if (!container) return alert(message);

        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        const icon = type === 'success' ? '✅' : '❌';
        toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
        container.appendChild(toast);

        requestAnimationFrame(() => {
            toast.style.opacity = '1';
            toast.style.transform = 'translateX(0)';
        });

        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    function lancarConfetes() {
        if (typeof confetti === 'function') {
            const count = 200;
            const defaults = {
                origin: { y: 0.7 },
                colors: ['#1B4332', '#FFEE8C', '#2D6A4F', '#F4D35E']
            };
            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }
            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }
    }

    // Boot: monta imediatamente com a regra de data / usuário já carregado no dashboard
    const initialUser = window.currentUserData || (window.getPsychologistData && window.getPsychologistData()) || null;
    mountStage(resolveNewPricing(initialUser));

    if (!token) return;

    try {
        const response = await fetch(`${BASE_URL}/api/psychologists/me?t=${new Date().getTime()}`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
            const user = await response.json();
            window.currentUserData = user;
            if (window.setPsychologistData) window.setPsychologistData(user);

            const activeNewPricing = resolveNewPricing(user);
            if (activeNewPricing !== mountedNewPricing) {
                mountStage(activeNewPricing);
            }

            if (activeNewPricing) {
                applyJan27UserState(user);
            } else {
                applyPreJanUserState(user);
            }
        }
    } catch (error) {
        console.error("Erro ao verificar status da assinatura:", error);
    }
})();
</script>
