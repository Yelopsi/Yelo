<!-- Container da Página de Análise de Favoritos -->
<div id="favoritos-analytics-container">

    <!-- 1. Cabeçalho da Página -->
    <div class="main-header" style="border-radius: 16px;">
        <div class="header-content">
            <button onclick="window.loadPage('psi_clinica_hub.html')" style="margin-bottom: 15px; background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background 0.2s;">&larr; Voltar para Clínica</button>
            <h1 style="margin: 0; font-family: var(--font-titulos); font-size: 2.2rem; color: white;">Quem te favoritou? ❤️</h1>
            <p style="margin: 5px 0 0 0; color: rgba(255,255,255,0.85); font-size: 1.1rem; max-width: 600px;">Entenda as características e interesses dos pacientes que salvaram seu perfil para futuras consultas.</p>
        </div>
    </div>

    <!-- Grid de Análises -->
    <div class="analytics-grid" id="favoritos-grid" style="margin-top: 25px;">
        <!-- Os cards serão inseridos aqui pelo JS -->
        <div class="widget" id="loading-favoritos" style="grid-column: 1 // -1; text-align: center; border-radius: 20px; padding: 40px;">
            <div class="loader-wrapper"><div class="loader-spinner"></div></div>
            <p style="color: #666; font-weight: 500; margin-top: 15px;">Mapeando o perfil dos seus pacientes...</p>
        </div>
    </div>

</div>

<!-- Carrega o script que desenha os gráficos desta página -->
<script src="/psi/psi_favoritos_analytics.js"></script>
