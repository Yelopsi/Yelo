<div class="main-header" style="margin-bottom: 20px;">
    <div class="header-content">
        <h1>Comunidade</h1>
        <p>Tire dúvidas e compartilhe conhecimento com outros profissionais.</p>
    </div>
</div>

<style>
    @media (max-width: 991px) {
        #comunidade-page-wrapper {
            padding-bottom: 80px; /* Garante que o último card não fique escondido pela navegação mobile */
        }
    }

    .modern-qna-filters {
        display: flex;
        gap: 10px;
        background: #f8f9fa;
        padding: 6px;
        border-radius: 50px;
        border: 1px solid #e9ecef;
        width: fit-content;
        flex-wrap: wrap; /* Para mobile */
    }
    .modern-qna-filters .tab-item {
        padding: 10px 24px;
        border-radius: 50px;
        font-size: 0.95rem;
        font-weight: 600;
        color: #666;
        cursor: pointer;
        transition: all 0.3s ease;
        border: none;
        background: transparent;
        font-family: var(--font-principal);
    }
    .modern-qna-filters .tab-item:hover {
        color: var(--verde-escuro);
        background: rgba(27, 67, 50, 0.05);
    }
    .modern-qna-filters .tab-item.active {
        background: var(--verde-escuro);
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(27, 67, 50, 0.2);
    }
    .qna-controls-wrapper {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 30px;
    }
    @media (min-width: 992px) {
        .qna-controls-wrapper {
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }
    }
</style>

<div id="comunidade-page-wrapper">
    <div class="qna-controls-wrapper">
        <div class="modern-qna-filters" id="qna-filter-tabs">
            <button class="tab-item active" data-filter="all">Todas</button>
            <button class="tab-item" data-filter="pending">Aguardando Resposta</button>
            <button class="tab-item" data-filter="answered">Respondidas por mim</button>
        </div>
        <div class="forum-search-bar" style="width: 100%; max-width: 400px;">
            <input type="text" id="forum-search-input" placeholder="Buscar por palavras-chave ou temas...">
        </div>
    </div>

    <!-- Alerta de Novas Perguntas -->
    <div id="qna-new-questions-alert" style="display:none; background:#e0f2fe; color:#0284c7; padding:15px 20px; border-radius:12px; margin-bottom:25px; font-weight:600; cursor:pointer; text-align:center; border: 1px solid #bae6fd; box-shadow: 0 4px 10px rgba(2, 132, 199, 0.05);" onclick="document.querySelector('.tab-item[data-filter=\'pending\']')?.click(); this.style.display='none';">
    </div>

    <div class="qna-container-admin" id="qna-list-container">
        <div class="loader-wrapper">
            <div class="loader-spinner"></div>
        </div>
    </div>

    <!-- Novo Sistema de Paginação -->
    <div id="qna-pagination" class="pagination-container"></div>
</div>

<template id="qna-card-template-psi">
    <div class="card qna-card-psi">
        <div class="qna-card-header">
            <h3 class="qna-question-title">Carregando título...</h3>
            <span class="qna-question-author">Perguntado por Anônimo</span>
        </div>
        <div class="qna-card-body">
            <p class="qna-question-content">Carregando conteúdo da pergunta...</p>
        </div>
        
        <div class="existing-answers-list">
            </div>

        <div class="qna-card-actions">
            <button class="btn btn-principal btn-responder">Responder</button>
        </div>
    </div>
</template>

<template id="qna-existing-answer-template">
    <div class="answer-item">
        <img src="https://placehold.co/40x40" alt="Foto do Psi" class="answer-psi-photo">
        <div class="answer-content">
            <strong><span class="answer-psi-name"></span></strong>
            <p class="answer-psi-text"></p>
        </div>
    </div>
</template>


<div id="qna-answer-modal" class="custom-modal-overlay" style="display: none;">
    <div class="custom-modal-box">
        <button class="modal-close-btn modal-close" style="position: absolute; top: 15px; right: 15px; background: #f5f5f5; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #666; transition: all 0.2s ease; z-index: 10;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h3 class="modal-title" style="margin-top: 0; color: #1B4332; font-family: var(--font-titulos); font-size: 1.5rem; margin-bottom: 15px;">Responder Pergunta</h3>
        
        <form id="qna-answer-form"> 
            <p style="font-size: 14px; color: var(--cinza-texto); margin-bottom: 20px; line-height: 1.5;">
                Sua resposta será pública e ajudará este usuário e outros na comunidade.
            </p>
            <div class="form-group" style="margin-bottom: 20px; text-align: left;">
                <label for="qna-answer-textarea" style="display: block; font-weight: 600; margin-bottom: 8px; color: #333;">Sua Resposta</label>
                <textarea id="qna-answer-textarea" minlength="50" required placeholder="Digite sua resposta aqui... Mínimo de 50 caracteres." style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #ccc; font-family: var(--font-principal); font-size: 1rem; resize: vertical; min-height: 120px; box-sizing: border-box;"></textarea>
                <div id="qna-char-counter" style="text-align: right; font-size: 0.85rem; color: #666; margin-top: 8px;">0/50 caracteres</div>
            </div>
            
            <div class="form-actions" style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px;">
                <button type="button" class="btn btn-secundario modal-cancel" style="padding: 10px 20px; border-radius: 50px;">Cancelar</button>
                <button type="submit" class="btn btn-principal" id="qna-submit-answer" disabled style="padding: 10px 20px; border-radius: 50px;">Enviar Resposta</button>
            </div>
        </form> 
    </div>
</div>
