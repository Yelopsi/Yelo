<div class="main-header">
    <h1>Enviar Comunicado</h1>
    <p>Envie uma mensagem para todos os psicólogos da plataforma.</p>
</div>

<div class="widget">
    <form id="form-comunicado">
        <div class="form-group">
            <label for="comunicado-titulo">Título do Comunicado</label>
            <input type="text" id="comunicado-titulo" class="form-control" value="Instabilidade na Plataforma" required>
        </div>
        
        <div class="form-group" style="display: flex; gap: 20px; align-items: center; margin-bottom: 15px;">
            <label style="margin-bottom: 0; font-weight: bold;">Tipo de Envio:</label>
            <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; margin-bottom: 0;">
                <input type="radio" name="tipo-envio" value="imediato" checked> Imediato
            </label>
            <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; margin-bottom: 0;">
                <input type="radio" name="tipo-envio" value="agendado"> Agendado
            </label>
        </div>

        <div class="form-group" id="container-agendamento" style="display: none;">
            <label for="comunicado-data">Data e Hora do Disparo</label>
            <input type="datetime-local" id="comunicado-data" class="form-control">
        </div>
        <div class="form-group">
            <label for="comunicado-conteudo">Conteúdo da Mensagem</label>
            <textarea id="comunicado-conteudo" class="form-control" rows="12" required>Olá, [nome]

Estamos enfrentando uma instabilidade pontual na plataforma, que já está sendo tratada pela equipe técnica. A orientação, por ora, é aguardar a normalização.

Para compensar o período de indisponibilidade:
– Usuários ainda no período gratuito terão os 14 dias restituídos
– Assinantes ativos receberão 50% de desconto na mensalidade

Seguimos trabalhando para resolver isso o mais rápido possível.

Agradecemos a compreensão.</textarea>
            <small style="color: #666; margin-top: 5px; display: block;">A tag `[nome]` será substituída automaticamente pelo nome de cada psicólogo.</small>
        </div>
        <div class="form-actions" style="justify-content: flex-end; margin-top: 20px;">
            <button type="submit" id="btn-enviar-comunicado" class="btn btn-primario">Enviar para todos os psicólogos</button>
        </div>
    </form>
</div>

<script>
(function() {
    const form = document.getElementById('form-comunicado');
    const btnSubmit = document.getElementById('btn-enviar-comunicado');
    const containerAgendamento = document.getElementById('container-agendamento');
    const inputData = document.getElementById('comunicado-data');
    const radioEnvio = document.getElementsByName('tipo-envio');
    const token = localStorage.getItem('Yelo_token') || localStorage.getItem('YeloAdmin_token') || (document.cookie.split('; ').find(row => row.startsWith('token=')) || '').split('=')[1];

    // Lógica para mostrar/esconder o campo de data
    radioEnvio.forEach(radio => {
        radio.addEventListener('change', (e) => {
            if (e.target.value === 'agendado') {
                containerAgendamento.style.display = 'block';
                inputData.required = true;
                btnSubmit.innerHTML = 'Agendar Disparo';
            } else {
                containerAgendamento.style.display = 'none';
                inputData.required = false;
                btnSubmit.innerHTML = 'Enviar para todos os psicólogos';
            }
        });
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('comunicado-titulo').value;
        const content = document.getElementById('comunicado-conteudo').value;
        const isScheduled = document.querySelector('input[name="tipo-envio"]:checked').value === 'agendado';
        const scheduledFor = isScheduled ? inputData.value : null;

        if (!title || !content) {
            showToast('Por favor, preencha o título e o conteúdo.', 'error');
            return;
        }

        const originalText = btnSubmit.innerHTML;
        btnSubmit.innerHTML = 'Enviando...';
        btnSubmit.disabled = true;

        try {
            const response = await fetch(`${API_BASE_URL}/api/admin/broadcast`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ title, content, scheduledFor })
            });

            const data = await response.json();

            if (response.ok) {
                showToast('Comunicado enviado com sucesso!', 'success');
            } else {
                showToast(data.error || 'Ocorreu um erro ao enviar.', 'error');
            }
        } catch (error) {
            showToast('Erro de conexão. Tente novamente.', 'error');
        } finally {
            btnSubmit.innerHTML = originalText;
            btnSubmit.disabled = false;
        }
    });
})();
</script>
