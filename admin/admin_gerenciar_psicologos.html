<!-- Filtros e Busca -->
<div class="filtros-container">
    <input type="text" id="search-input" class="campo-busca" placeholder="Buscar por nome, email ou CRP...">
    <select id="status-filter" class="filtro-select">
        <option value="">Todos os Status</option>
        <option value="active">Ativo</option>
        <option value="pending">Pendente</option>
        <option value="inactive">Inativo</option>
        <option value="deleted">Excluídos (Lixeira)</option>
    </select>
    <select id="plano-filter" class="filtro-select">
        <option value="">Todos os Planos</option>
        <option value="ESSENTIAL">Essencial</option>
        <option value="CLINICAL">Clínico</option>
        <option value="REFERENCE">Referência</option>
    </select>
</div>

<!-- Tabela de Gerenciamento -->
<div class="tabela-container">
    <div class="tabela-wrapper">
        <table class="tabela-gerenciamento">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Cadastro</th>
                    <th>Plano</th>
                    <th>Status VIP</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="psychologists-table-body">
                <!-- Linhas serão inseridas aqui pelo JS -->
            </tbody>
        </table>
    </div>
    <div id="pagination-container" class="pagination-container" style="margin-top: 20px;"></div>
</div>

<style>
    /* Estilo do Botão VIP na Tabela */
    .btn-vip-toggle {
        background: #f0f0f0;

        padding: 5px 10px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.8rem;
        transition: all 0.2s;
    }
    .btn-vip-toggle.active {
        background: linear-gradient(135deg, #FFD700 0%, #FDB931 100%); /* Dourado */
        color: #1B4332;

        font-weight: bold;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .btn-vip-toggle:hover {
        transform: scale(1.05);
