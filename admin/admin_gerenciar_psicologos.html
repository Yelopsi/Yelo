<div class="modern-dashboard-layout">
    <div class="main-header">
        <div>
            <h1>Gestão de Psicólogos</h1>
            <p class="subtitulo-header">Administre os cadastros, planos e status dos profissionais na plataforma.</p>
        </div>
    </div>

    <!-- KPIs de Resumo -->
    <div class="kpi-grid">
        <div class="kpi-card" style="border-top-color: #3498db;">
            <h4 style="display: flex; align-items: center; gap: 8px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> Total de Profissionais</h4>
            <p class="kpi-numero" id="kpi-total-psis" style="color: #3498db;">0</p>
        </div>
        <div class="kpi-card" style="border-top-color: var(--verde-sucesso);">
            <h4 style="display: flex; align-items: center; gap: 8px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> Ativos</h4>
            <p class="kpi-numero" id="kpi-ativos-psis" style="color: var(--verde-sucesso);">0</p>
        </div>
        <div class="kpi-card" style="border-top-color: #f39c12;">
            <h4 style="display: flex; align-items: center; gap: 8px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> Pendentes</h4>
            <p class="kpi-numero" id="kpi-pendentes-psis" style="color: #f39c12;">0</p>
        </div>
        <div class="kpi-card" style="border-top-color: var(--coral-quente);">
            <h4 style="display: flex; align-items: center; gap: 8px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg> Inativos</h4>
            <p class="kpi-numero" id="kpi-inativos-psis" style="color: var(--coral-quente);">0</p>
        </div>
        <div class="kpi-card" style="border-top-color: #FFD700;">
            <h4 style="display: flex; align-items: center; gap: 8px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg> VIPs (Isentos)</h4>
            <p class="kpi-numero" id="kpi-vip-psis" style="color: #d4af37;">0</p>
        </div>
    </div>

    <!-- Filtros e Busca -->
    <div class="widget" style="margin-bottom: 25px;">
        <div class="filtros-container" style="margin-bottom: 0;">
            <div class="search-wrapper" style="flex-grow: 1; position: relative;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #999;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" class="campo-busca" placeholder="Buscar por nome, email ou CRP..." style="width: 100%; padding-left: 42px;">
            </div>
            <select id="status-filter" class="filtro-select">
                <option value="">Todos os Status</option>
                <option value="active">Ativo</option>
                <option value="pending">Pendente</option>
                <option value="inactive">Inativo</option>
                <option value="deleted">Excluídos (Lixeira)</option>
            </select>
            <select id="plano-filter" class="filtro-select">
                <option value="">Todos os Planos</option>
                <option value="ESSENTIAL">Essencial</option>
                <option value="CLINICAL">Clínico</option>
                <option value="REFERENCE">Referência</option>
            </select>
        </div>
    </div>

    <!-- Tabela de Gerenciamento -->
    <div class="tabela-container">
        <div class="tabela-wrapper">
            <table class="tabela-gerenciamento">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Cadastro</th>
                        <th>Plano</th>
                        <th>Status VIP</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="psychologists-table-body">
                    <!-- Linhas serão inseridas aqui pelo JS -->
                    <tr>
                        <td colspan="7" class="loading-row" style="text-align: center; padding: 40px; color: var(--cinza-texto);">
                            <span class="loading-spinner-sm"></span>
                            Carregando profissionais...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div id="pagination-container" class="pagination-container" style="margin-top: 20px;"></div>
    </div>
</div>
