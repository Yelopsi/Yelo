<div class="modern-dashboard-layout" style="padding-bottom: 120px;">
    <div class="main-header" style="background: linear-gradient(135deg, #1B4332 0%, #0f2b20 100%); padding: 25px 30px; margin-bottom: 25px; border-radius: 16px;">
        <div>
            <h1 style="color: white; margin: 0 0 5px 0; font-size: 1.8rem; font-family: var(--font-titulos);">Leads Inbound (Lista de Espera)</h1>
            <p style="color: rgba(255,255,255,0.8); margin: 0;">Profissionais que iniciaram o preenchimento do questionário mas não finalizaram.</p>
        </div>
    </div>

    <style>
        .crm-pill {
            background: #f8f9fa;
            color: #64748b;
            border: 1px solid #e2e8f0;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .crm-pill:hover { background: #e2e8f0; color: #1e293b; }
        .crm-pill.active { background: #1B4332; color: white; border-color: #1B4332; box-shadow: 0 2px 4px rgba(27, 67, 50, 0.2); }
    </style>

    <div class="widget" style="margin-bottom: 25px;">
        <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 15px; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 15px;">
            <div class="crm-funnel-tabs" style="display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 5px; -webkit-overflow-scrolling: touch; scrollbar-width: none;">
                <button class="crm-pill active" data-filter="all">Todos os Leads</button>
                <button class="crm-pill" data-filter="pending">Apenas Pendentes</button>
                <button class="crm-pill" data-filter="invited">Já Contatados</button>
            </div>
            <input type="hidden" id="crm-status-espera" value="all">
            <div class="search-wrapper" style="position: relative; width: 300px; max-width: 100%;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #999;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" class="campo-busca" placeholder="Buscar lead..." style="width: 100%; padding-left: 42px;">
            </div>
        </div>
    </div>

    <div class="tabela-container">
        <div class="tabela-wrapper">
            <table class="tabela-gerenciamento">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>CRP</th>
                        <th>Status</th>
                        <th>Data de Entrada</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="waiting-list-body">
                    <tr>
                        <td colspan="6" class="loading-row" style="text-align: center; padding: 40px; color: var(--cinza-texto);"><span class="loading-spinner-sm"></span> Carregando lista de espera...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Template para cada linha da tabela (usado pelo JS) -->
<template id="waiting-list-row-template">
    <tr>
        <td data-label="Nome"></td>
        <td data-label="Email"></td>
        <td data-label="CRP"></td>
        <td data-label="Status">
            <span class="status-badge"></span>
        </td>
        <td data-label="Data de Entrada"></td>
        <td data-label="Ações">
            <!-- Botões de ação serão inseridos aqui pelo JS -->
        </td>
    </tr>
</template>
