<div class="modern-dashboard-layout">
    <div class="main-header" style="padding: 20px 25px; margin-bottom: 25px;">
        <div>
            <h1 style="font-size: 1.8rem;">Prospecção de Psicólogos</h1>
            <p class="subtitulo-header">Gerencie seus leads e acompanhe o funil de outbound.</p>
        </div>
        <div class="dashboard-header-actions">
            <button class="btn btn-secundario" style="color: white; border-color: white;" onclick="carregarLeads()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                Atualizar Lista
            </button>
        </div>
    </div>

    <div class="tabela-container">
        <div class="filtros-container">
            <select id="filtro-funil" class="filtro-select" style="max-width: 250px;" onchange="carregarLeads()">
                <option value="pendentes">Leads Pendentes (Novos)</option>
                <option value="followup_hoje">Follow-ups do Dia</option>
            </select>
        </div>

        <div class="tabela-wrapper">
            <table class="tabela-gerenciamento" id="tabela-leads">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Status</th>
                        <th>Origem</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-leads-body">
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 30px; color: #888;">
                            Carregando leads...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Elementos da DOM
    const filtroFunil = document.getElementById('filtro-funil');
    const listaLeadsBody = document.getElementById('lista-leads-body');

    // Mensagem padrão de prospecção (Pode ser editada/melhorada)
    const mensagemPadrao = encodeURIComponent(
        "Olá, tudo bem? Sou da Yelo Saúde Mental e vi o seu perfil profissional. Acredito que a sua abordagem combina muito com os pacientes que buscam ajuda na nossa plataforma. Gostaria de apresentar a Yelo para você. Tem um minutinho?"
    );

    /**
     * Carrega a lista de Leads do Backend
     */
    async function carregarLeads() {
        try {
            listaLeadsBody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 30px; color: #888;">Carregando...</td></tr>`;
            
            const filtro = filtroFunil.value;
            
            // Envia credentials se a sua rota de Admin usar Cookie. Se usar Bearer token, adicione nos headers.
            const response = await fetch(`/api/admin/leads?filtro=${filtro}`, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'initially_omitted' // Caso você use Cookies (ajustado pelo seu sistema de login)
            });

            if (!response.ok) throw new Error('Falha ao buscar leads');
            
            const leads = await response.json();
            renderizarLeads(leads);

        } catch (error) {
            console.error('Erro ao carregar leads:', error);
            listaLeadsBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #E63946;">Erro ao carregar leads. Tente novamente.</td></tr>`;
        }
    }

    /**
     * Renderiza o HTML da tabela
     */
    function renderizarLeads(leads) {
        if (leads.length === 0) {
            listaLeadsBody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 30px; color: #888; font-style: italic;">Nenhum lead encontrado para este filtro.</td></tr>`;
            return;
        }

        listaLeadsBody.innerHTML = leads.map(lead => {
            // Formatando Origem para exibição elegante (Ex: 'diretorio-exemplo.com.br')
            let origemCurta = lead.origem_url;
            try { origemCurta = new URL(lead.origem_url).hostname; } catch(e) {}

            // Formatando o status em badges visuais
            let badgeStatus = `<span class="status status-pending">Pendente</span>`;
            if (lead.status_funil === 'Contatado') badgeStatus = `<span class="status" style="background: #e0f2fe; color: #0284c7;">Contatado</span>`;
            else if (lead.status_funil === 'Aguardando') badgeStatus = `<span class="status status-aviso">Aguardando</span>`;

            return `
                <tr id="lead-row-${lead.id}">
                    <td data-label="Nome" style="font-weight: 600; color: #333;">${lead.nome}</td>
                    <td data-label="Telefone">${mascaraTelefone(lead.telefone)}</td>
                    <td data-label="Status">${badgeStatus}</td>
                    <td data-label="Origem">
                        <a href="${lead.origem_url}" target="_blank" style="color: #1B4332; font-size: 0.85rem;">
                            ${origemCurta || 'Desconhecida'}
                        </a>
                    </td>
                    <td data-label="Ações">
                        <button class="btn btn-primario btn-sm" onclick="enviarWhatsApp('${lead.id}', '${lead.telefone}', '${lead.nome}')" style="display: flex; align-items: center; gap: 5px; margin: 0 auto;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                            Enviar WhatsApp
                        </button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    /**
     * FUNÇÃO PRINCIPAL: Abre o Zap e marca como contatado no banco de dados
     */
    async function enviarWhatsApp(id, telefoneRaw, nome) {
        try {
            // 1. Limpa o telefone para garantir apenas números
            let telefoneNum = telefoneRaw.replace(/\D/g, '');
            
            // Adiciona +55 caso não tenha (Padrão Brasil)
            if (telefoneNum.length === 10 || telefoneNum.length === 11) {
                telefoneNum = '55' + telefoneNum;
            }

            // 2. Abre a janela do WhatsApp Web ou App
            const linkWhatsApp = \`https://wa.me/\${telefoneNum}?text=\${mensagemPadrao}\`;
            window.open(linkWhatsApp, '_blank');

            // 3. Atualiza o status no Backend (PUT) de forma assíncrona
            const req = await fetch(\`/api/admin/leads/\${id}/contato\`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' }
            });

            if (req.ok) {
                // 4. Feedback Visual: Remove a linha (animação suave) se estiver na aba "Pendentes"
                const row = document.getElementById(\`lead-row-\${id}\`);
                if (row && filtroFunil.value === 'pendentes') {
                    row.style.opacity = '0';
                    row.style.transition = 'opacity 0.3s ease';
                    setTimeout(() => row.remove(), 300);
                } else {
                    // Se estiver na aba Follow-up, apenas recarrega a tabela para atualizar as datas
                    carregarLeads();
                }
            } else {
                console.warn("Aviso: WhatsApp foi aberto, mas ocorreu uma falha ao registrar o contato no banco.");
            }

        } catch (error) {
            console.error("Erro ao enviar contato:", error);
            alert("Erro ao atualizar status do lead. O WhatsApp pode não ter aberto corretamente.");
        }
    }

    /**
     * Helper para formatar o telefone na tabela
     */
    function mascaraTelefone(tel) {
        if (!tel) return '';
        let r = tel.replace(/\D/g, "");
        if (r.length === 11) {
            return r.replace(/^(\d{2})(\d{5})(\d{4}).*/, "($1) $2-$3");
        } else if (r.length === 10) {
            return r.replace(/^(\d{2})(\d{4})(\d{4}).*/, "($1) $2-$3");
        }
        return tel;
    }

    // Carrega a tabela assim que o arquivo html for montado no dashboard
    setTimeout(() => {
        carregarLeads();
    }, 100);

</script>
