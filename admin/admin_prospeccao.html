<div class="modern-dashboard-layout">
    <style>
        @media (max-width: 768px) {
            .mobile-action-bar {
                padding: 0 15px !important;
                display: flex !important;
                gap: 8px;
            }
            .mobile-action-bar .btn {
                margin-right: 0 !important;
                flex: 1;
                padding: 8px 4px !important;
                font-size: 0.75rem !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: center !important;
                white-space: normal !important;
                text-align: center !important;
                line-height: 1.2 !important;
                min-width: 0;
            }
            .mobile-action-bar .btn svg {
                margin-right: 0 !important;
                margin-bottom: 4px !important;
            }
        }
    </style>
    <div class="main-header" style="padding: 20px 25px; margin-bottom: 15px;">
        <div>
            <h1 style="font-size: 1.8rem;">Prospecção de Psicólogos</h1>
            <p class="subtitulo-header">Gerencie seus leads e acompanhe o funil de outbound.</p>
        </div>
    </div>

    <!-- Botões movidos para fora do header para layout App-like no Mobile -->
    <div class="action-bar-scrollable mobile-action-bar" style="margin-bottom: 25px; padding: 0 25px;">
        <button class="btn btn-primario" style="background-color: #8b5cf6; border-color: #8b5cf6; margin-right: 10px;" onclick="iniciarRoboScraper()" id="btn-cacar-leads">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8" y2="16"></line><line x1="16" y1="16" x2="16" y2="16"></line></svg>
            Caçar Leads
        </button>
        <button class="btn btn-primario" style="background-color: #10B981; border-color: #10B981; margin-right: 10px;" onclick="exportarLeadsCSV()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Exportar CSV
        </button>
        <button class="btn btn-secundario" style="background: #fff; color: var(--verde-escuro); border-color: var(--verde-escuro);" onclick="carregarLeads()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
            Atualizar
        </button>
    </div>

    <!-- Dashboard de Conversão (KPIs) -->
    <div class="kpi-grid" style="margin-bottom: 25px;">
        <div class="kpi-card" style="border-top-color: #f59e0b;">
            <h4>Novos Leads</h4>
            <p class="kpi-numero" id="kpi-pendentes">--</p>
        </div>
        <div class="kpi-card" style="border-top-color: #0284c7;">
            <h4>Em Negociação</h4>
            <p class="kpi-numero" id="kpi-contatados">--</p>
        </div>
        <div class="kpi-card" style="border-top-color: #8b5cf6;">
            <h4>Em Espera</h4>
            <p class="kpi-numero" id="kpi-aguardando">--</p>
        </div>
        <div class="kpi-card" style="border-top-color: #10b981;">
            <h4>Convertidos</h4>
            <p class="kpi-numero" id="kpi-cadastrados">--</p>
        </div>
    </div>

    <div class="tabela-container">
        <div class="filtros-container">
            <select id="filtro-funil" class="filtro-select" style="max-width: 250px;" onchange="carregarLeads()">
                <option value="pendentes">Leads Pendentes (Novos)</option>
                <option value="contatados">Em Negociação (Contatados)</option>
                <option value="aguardando">Em Espera (Aguardando)</option>
                <option value="followup_hoje">Follow-ups do Dia</option>
            </select>
        </div>

        <div class="tabela-wrapper">
            <table class="tabela-gerenciamento" id="tabela-leads">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Status</th>
                        <th>Origem</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-leads-body">
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 30px; color: #888;">
                            Carregando leads...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Paginação -->
        <div id="leads-pagination" class="pagination-container"></div>
    </div>
</div>

<!-- Modal de Escolha da Mensagem de WhatsApp -->
<div id="modal-copy-whatsapp" class="modal-overlay">
    <div class="modal-content" style="max-width: 600px;">
        <div class="modal-header">
            <h2>Enviar Mensagem</h2>
            <button class="modal-close" onclick="fecharModalZap()">&times;</button>
        </div>
        <div class="modal-body">
            <p style="margin-bottom: 20px;">Qual roteiro deseja enviar para <strong id="modal-zap-nome"></strong>?</p>
            <div style="display:flex; flex-direction:column; gap:12px;">
                <button class="btn btn-secundario" style="text-align:left; height:auto; line-height:1.4; padding:15px; border-color:#e2e8f0; color:#333;" onclick="enviarCopiaDoModal('pitch')" onmouseover="this.style.backgroundColor='#f0fdf4'; this.style.borderColor='var(--verde-escuro)'" onmouseout="this.style.backgroundColor='transparent'; this.style.borderColor='#e2e8f0'"><strong>1. Pitch / Convite</strong><br><small style="color:#666;">Explicação do Hub, ferramentas e Trial de 14 dias.</small></button>
                <button class="btn btn-secundario" style="text-align:left; height:auto; line-height:1.4; padding:15px; border-color:#e2e8f0; color:#333;" onclick="enviarCopiaDoModal('followup1')" onmouseover="this.style.backgroundColor='#f0fdf4'; this.style.borderColor='var(--verde-escuro)'" onmouseout="this.style.backgroundColor='transparent'; this.style.borderColor='#e2e8f0'"><strong>2. Follow-up 1 (Lembrete)</strong><br><small style="color:#666;">Perguntando se conseguiu olhar a plataforma.</small></button>
                <button class="btn btn-secundario" style="text-align:left; height:auto; line-height:1.4; padding:15px; border-color:#e2e8f0; color:#333;" onclick="enviarCopiaDoModal('followup2')" onmouseover="this.style.backgroundColor='#f0fdf4'; this.style.borderColor='var(--verde-escuro)'" onmouseout="this.style.backgroundColor='transparent'; this.style.borderColor='#e2e8f0'"><strong>3. Follow-up 2 (Despedida)</strong><br><small style="color:#666;">Mensagem rápida sem pressão, deixando portas abertas.</small></button>
            </div>
        </div>
    </div>
</div>
