<div class="modern-dashboard-layout">
    <div class="main-header">
        <div>
            <h1>Gestão de Pacientes</h1>
            <p class="subtitulo-header">Visualize e gerencie todos os pacientes da plataforma.</p>
        </div>
    </div>

    <div class="widget" style="margin-bottom: 25px;">
        <div class="filtros-container patient-controls-row" style="margin-bottom: 0;">
            <div class="search-wrapper" style="flex-grow: 1; position: relative;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #999;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="campo-busca" placeholder="Buscar por nome ou e-mail..." style="width: 100%; padding-left: 42px;">
            </div>
            <button class="btn-primario" style="display: flex; align-items: center; gap: 8px; border-radius: 50px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Adicionar Paciente
            </button>
        </div>
    </div>

    <div class="tabela-container">
        <div class="tabela-wrapper">
            <table class="tabela-gerenciamento">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Data de Cadastro</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="patients-table-body">
                    <tr>
                        <td colspan="5" class="loading-row" style="text-align: center; padding: 40px; color: var(--cinza-texto);"><span class="loading-spinner-sm"></span> Carregando pacientes...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<template id="patient-row-template">
    <tr>
        <td data-label="Nome"></td>
        <td data-label="E-mail"></td>
        <td data-label="Data de Cadastro"></td>
        <td data-label="Status"><span class="status"></span></td>
        <td data-label="Ações"></td>
    </tr>
</template>
