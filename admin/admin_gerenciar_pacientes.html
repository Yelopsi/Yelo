<!-- Título da Página -->
<div class="welcome-header">
    <h1>Gerenciar Pacientes</h1>
    <p>Administre os pacientes cadastrados na plataforma.</p>
</div>

<!-- Filtros e Ações -->
<div class="filtros-container">
    <input type="text" id="search-input" class="campo-busca" placeholder="Buscar por nome ou e-mail...">
</div>

<!-- Tabela de Pacientes -->
<div class="tabela-container">
    <div class="tabela-wrapper">
        <table class="tabela-gerenciamento">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Cadastro</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="patients-table-body">
                <!-- As linhas serão inseridas aqui pelo JavaScript -->
            </tbody>
        </table>
    </div>
    <div id="pagination-container" class="pagination-container"></div>
</div>
